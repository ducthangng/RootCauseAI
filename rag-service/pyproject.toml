[project]
name = "rootcauseai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "deepagents>=0.7.19",
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "instructor>=1.17.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "openai>=3.3.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "ragas>=0.4.3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[tool.uv.workspace]
members = [
    "ingestion_service",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
